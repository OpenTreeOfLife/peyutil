[build-system]
requires = ["flit_core >= 3.12.0, <4"]
build-backend = "flit_core.buildapi"

[project]
name = "peyutil"
dynamic = ["version", "description"]
authors = [
  { name="Mark Holder", email="mtholder@gmail.com" },
  { name="Emily Jane McTavish"},
  { name="Jim Allman", email="jim@ibang.com"},
  { name="Karen A. Cranston"},
]
readme = "README.md"
requires-python = ">=3.6"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
license = "BSD"
license-files = ["LICENSE"]

[project.urls]
Homepage = "https://github.com/OpenTreeOfLife/peyutil"
Issues = "https://github.com/OpenTreeOfLife/peyutil/issues"
